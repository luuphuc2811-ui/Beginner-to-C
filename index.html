(window.LEARNC_DATA = window.LEARNC_DATA || []).push({"day": 7, "title": "Day 7", "sub": "Strings: char, strlen, strcmp, counting characters", "plan": "About 20 minutes of theory, 15 minutes reading and running the 2 examples, and 60 to 90 minutes on the 4 exercises. Exercises 3 and 4 work on strings of up to 10<sup>6</sup> characters, so the code must be efficient.", "goals": ["Understand that a string in C is an array of <code>char</code> ended by <code>'\\0'</code>, and read, print and loop over it.", "Treat characters as small numbers: <code>s[i] - 'a'</code> gives a position from 0 to 25, which is the key to counting letters.", "Use <code>strlen</code> and <code>strcmp</code> correctly, and know why <code>==</code> does not compare strings.", "Read a whole line with spaces using <code>fgets</code>, and apply sliding-window counting to long strings."], "theory": [{"title": "Characters and strings", "parts": [{"t": "html", "html": "<p>A <code>char</code> is a small integer (one byte) that stands for a character. The character <code>'a'</code> is the number 97, <code>'b'</code> is 98, ..., <code>'z'</code> is 122; <code>'A'</code> is 65 and <code>'0'</code> is 48. Letters and digits are in consecutive order, so <code>'c' - 'a'</code> is 2 and <code>'7' - '0'</code> is 7.</p>\n<p>A <b>string</b> is an array of <code>char</code> whose last meaningful element is followed by the special character <code>'\\0'</code> (the number 0). This marker tells functions where the text ends. So an array for a word of up to 100 letters must have <b>101</b> elements: one extra for the <code>'\\0'</code>. <code>scanf(\"%s\", s)</code> reads one word (it stops at a space or newline), writes it into <code>s</code> and adds the <code>'\\0'</code> itself. There is no <code>&amp;</code> before <code>s</code>, because an array name already stands for the array. <code>strlen(s)</code> (from <code>&lt;string.h&gt;</code>) counts the characters before the <code>'\\0'</code>.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;string.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-mi\">101</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// 100 letters + the '\\0'</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">strlen</span><span class=\"p-p\">(</span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"length = %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"s[%d] = '%c', code %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// %c: as a character, %d: as a number</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// make it uppercase</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'a'</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;&amp;</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'z'</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-sc\">'a'</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-sc\">'A'</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// %s prints the whole string</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char s[101];                 // 100 letters + the '\\0'\n    scanf(\"%s\", s);\n\n    int n = strlen(s);\n    printf(\"length = %d\\n\", n);\n    for (int i = 0; i < n; i++) {\n        printf(\"s[%d] = '%c', code %d\\n\", i, s[i], s[i]);   // %c: as a character, %d: as a number\n    }\n\n    for (int i = 0; i < n; i++) {                  // make it uppercase\n        if (s[i] >= 'a' && s[i] <= 'z') {\n            s[i] = s[i] - 'a' + 'A';\n        }\n    }\n    printf(\"%s\\n\", s);           // %s prints the whole string\n    return 0;\n}", "runs": [{"in": "Cab", "out": "length = 3\ns[0] = 'C', code 67\ns[1] = 'a', code 97\ns[2] = 'b', code 98\nCAB"}, {"in": "hello", "out": "length = 5\ns[0] = 'h', code 104\ns[1] = 'e', code 101\ns[2] = 'l', code 108\ns[3] = 'l', code 108\ns[4] = 'o', code 111\nHELLO"}]}, {"t": "html", "html": "<div class=\"box warn\"><b>Take care.</b> Evaluate <code>strlen(s)</code> <b>once</b> and keep it in a variable. Writing <code>i &lt; strlen(s)</code> in the loop condition makes C count the whole string again at every step, which is slow for a string of 10<sup>6</sup> characters. Also, an array that is too small is not detected: a longer word silently overwrites the memory after it.</div>"}]}, {"title": "Counting characters", "parts": [{"t": "html", "html": "<p>This is the frequency array of Day 3, with the characters as indexes. For a lowercase letter <code>c</code>, the expression <code>c - 'a'</code> is a number from 0 to 25 (<code>'a'</code> is 0, <code>'b'</code> is 1, ...). So <code>freq[26]</code> can store how many times each letter appears: add 1 at <code>freq[s[i] - 'a']</code> for every character. One pass over the string, and every question about &ldquo;how many of this letter&rdquo; is answered immediately.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;string.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-mi\">1001</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">strlen</span><span class=\"p-p\">(</span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">freq</span><span class=\"p-p\">[</span><span class=\"p-mi\">26</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-mi\">0</span><span class=\"p-p\">};</span><span class=\"p-w\">  </span><span class=\"p-c1\">// freq[0] counts 'a', freq[1] counts 'b', ...</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">freq</span><span class=\"p-p\">[</span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-sc\">'a'</span><span class=\"p-p\">]</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">26</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">freq</span><span class=\"p-p\">[</span><span class=\"p-n\">c</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%c: %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-sc\">'a'</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">freq</span><span class=\"p-p\">[</span><span class=\"p-n\">c</span><span class=\"p-p\">]);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// number c back to a letter</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char s[1001];\n    scanf(\"%s\", s);\n    int n = strlen(s);\n\n    int freq[26] = {0};                  // freq[0] counts 'a', freq[1] counts 'b', ...\n    for (int i = 0; i < n; i++) {\n        freq[s[i] - 'a']++;\n    }\n\n    for (int c = 0; c < 26; c++) {\n        if (freq[c] > 0) {\n            printf(\"%c: %d\\n\", 'a' + c, freq[c]);    // number c back to a letter\n        }\n    }\n    return 0;\n}", "runs": [{"in": "banana", "out": "a: 3\nb: 1\nn: 2"}, {"in": "mississippi", "out": "i: 4\nm: 1\np: 2\ns: 4"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> The conversion works in both directions: <code>s[i] - 'a'</code> turns a letter into an index, and <code>'a' + c</code> turns an index back into a letter. This version assumes that the string has only lowercase letters; with other characters the index would leave the array. If the string can contain uppercase letters or digits, make the array bigger (for example <code>freq[256]</code> and use <code>freq[(unsigned char) s[i]]</code>).</div>"}]}, {"title": "Comparing strings", "parts": [{"t": "html", "html": "<p>Never compare two strings with <code>==</code>: that compares the <i>addresses</i> of the two arrays, not their contents, so it is always false for two different arrays. Use <code>strcmp(a, b)</code> from <code>&lt;string.h&gt;</code>. It returns <b>0</b> when the strings are equal, a <b>negative</b> number when <code>a</code> comes before <code>b</code> in dictionary order, and a <b>positive</b> number when <code>a</code> comes after <code>b</code>. The order is by character code, so every uppercase letter comes before every lowercase letter (<code>'Z'</code> is 90, <code>'a'</code> is 97). Do not test for a specific value such as 1 or -1; test only the sign: <code>&lt; 0</code>, <code>== 0</code>, <code>&gt; 0</code>.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;string.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">101</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">[</span><span class=\"p-mi\">101</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s %s\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">r</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">strcmp</span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">r</span><span class=\"p-w\"> </span><span class=\"p-o\">==</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"equal</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span><span class=\"p-w\"> </span><span class=\"p-k\">else</span><span class=\"p-w\"> </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">r</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s comes first</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span><span class=\"p-w\"> </span><span class=\"p-k\">else</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s comes first</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char a[101], b[101];\n    scanf(\"%s %s\", a, b);\n\n    int r = strcmp(a, b);\n    if (r == 0) printf(\"equal\\n\");\n    else if (r < 0) printf(\"%s comes first\\n\", a);\n    else printf(\"%s comes first\\n\", b);\n    return 0;\n}", "runs": [{"in": "apple apple", "out": "equal"}, {"in": "apple banana", "out": "apple comes first"}, {"in": "b a", "out": "a comes first"}, {"in": "app apple", "out": "app comes first"}, {"in": "Zebra apple", "out": "Zebra comes first"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> <code>&quot;app&quot;</code> comes before <code>&quot;apple&quot;</code>: when one string is the beginning of the other, the shorter one is smaller. <code>&quot;Zebra&quot;</code> comes before <code>&quot;apple&quot;</code> because of the character codes. To copy a string use <code>strcpy(dest, src)</code>; the statement <code>dest = src</code> does not work for arrays.</div>"}]}, {"title": "Reading a whole line", "parts": [{"t": "html", "html": "<p><code>scanf(\"%s\")</code> stops at the first space, so it cannot read a sentence. Use <code>fgets(line, size, stdin)</code>: it reads a full line, up to <code>size - 1</code> characters, and <b>keeps the newline</b> <code>'\\n'</code> at the end of the text if the line fits. Usually you remove it:</p>"}, {"t": "snippet", "html": "<span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-mi\">1001</span><span class=\"p-p\">];</span>\n<span class=\"p-n\">fgets</span><span class=\"p-p\">(</span><span class=\"p-n\">line</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">sizeof</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">stdin</span><span class=\"p-p\">);</span>\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">strlen</span><span class=\"p-p\">(</span><span class=\"p-n\">line</span><span class=\"p-p\">);</span>\n<span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;&amp;</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">==</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\n'</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\0'</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// cut the newline: the string is now one character shorter</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">n</span><span class=\"p-o\">--</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "char line[1001];\nfgets(line, sizeof line, stdin);\nint n = strlen(line);\nif (n > 0 && line[n - 1] == '\\n') {\n    line[n - 1] = '\\0';              // cut the newline: the string is now one character shorter\n    n--;\n}"}, {"t": "html", "html": "<p>A common trap: after <code>scanf(\"%d\", &amp;k)</code> the newline that ends that line is still waiting in the input, so a following <code>fgets</code> would read an <i>empty line</i>. Read and throw away the rest of the first line before calling <code>fgets</code>:</p>"}, {"t": "snippet", "html": "<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-p\">;</span>\n<span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">k</span><span class=\"p-p\">);</span>\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">ch</span><span class=\"p-p\">;</span>\n<span class=\"p-k\">while</span><span class=\"p-w\"> </span><span class=\"p-p\">((</span><span class=\"p-n\">ch</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">getchar</span><span class=\"p-p\">())</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\n'</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;&amp;</span><span class=\"p-w\"> </span><span class=\"p-n\">ch</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-n\">EOF</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-p\">}</span><span class=\"p-w\">  </span><span class=\"p-c1\">// skip the rest of the first line</span>\n<span class=\"p-n\">fgets</span><span class=\"p-p\">(</span><span class=\"p-n\">line</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">sizeof</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">stdin</span><span class=\"p-p\">);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// now it reads the real second line</span>", "raw": "int k;\nscanf(\"%d\", &k);\nint ch;\nwhile ((ch = getchar()) != '\\n' && ch != EOF) { }   // skip the rest of the first line\nfgets(line, sizeof line, stdin);                    // now it reads the real second line"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;string.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-mi\">1001</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">fgets</span><span class=\"p-p\">(</span><span class=\"p-n\">line</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">sizeof</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">stdin</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">strlen</span><span class=\"p-p\">(</span><span class=\"p-n\">line</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;&amp;</span><span class=\"p-w\"> </span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">==</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\n'</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\0'</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">n</span><span class=\"p-o\">--</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">words</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">inWord</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// inWord = 1 while we are inside a word</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">line</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-sc\">' '</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-o\">!</span><span class=\"p-n\">inWord</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">                </span><span class=\"p-n\">words</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// a new word starts here</span>\n<span class=\"p-w\">            </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">inWord</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span><span class=\"p-w\"> </span><span class=\"p-k\">else</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">inWord</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d characters, %d words</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">words</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char line[1001];\n    fgets(line, sizeof line, stdin);\n    int n = strlen(line);\n    if (n > 0 && line[n - 1] == '\\n') {\n        line[n - 1] = '\\0';\n        n--;\n    }\n\n    int words = 0, inWord = 0;           // inWord = 1 while we are inside a word\n    for (int i = 0; i < n; i++) {\n        if (line[i] != ' ') {\n            if (!inWord) words++;        // a new word starts here\n            inWord = 1;\n        } else {\n            inWord = 0;\n        }\n    }\n    printf(\"%d characters, %d words\\n\", n, words);\n    return 0;\n}", "runs": [{"in": "the quick  brown fox", "out": "20 characters, 4 words"}, {"in": "hello", "out": "5 characters, 1 words"}, {"in": "   spaces   around   ", "out": "21 characters, 2 words"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> The words are counted at the moment each one <i>starts</i> (a non-space after a space or at the beginning), so several spaces in a row do not create extra words.</div>"}]}], "examples": [{"title": "Palindrome check", "parts": [{"t": "html", "html": "<p>A word is a <b>palindrome</b> if it reads the same backwards (<code>level</code>, <code>noon</code>). Use two indexes: <code>i</code> from the left end and <code>j</code> from the right end. Compare the two characters, move both toward the middle, and stop at the first difference. This is the two-pointer idea of Day 4, now on a string.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;string.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-mi\">100001</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">strlen</span><span class=\"p-p\">(</span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">ok</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">while</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">[</span><span class=\"p-n\">j</span><span class=\"p-p\">])</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">ok</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">            </span><span class=\"p-k\">break</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">j</span><span class=\"p-o\">--</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">ok</span><span class=\"p-w\"> </span><span class=\"p-o\">?</span><span class=\"p-w\"> </span><span class=\"p-s\">\"YES\"</span><span class=\"p-w\"> </span><span class=\"p-o\">:</span><span class=\"p-w\"> </span><span class=\"p-s\">\"NO\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char s[100001];\n    scanf(\"%s\", s);\n    int n = strlen(s);\n\n    int i = 0, j = n - 1;\n    int ok = 1;\n    while (i < j) {\n        if (s[i] != s[j]) {\n            ok = 0;\n            break;\n        }\n        i++;\n        j--;\n    }\n    printf(\"%s\\n\", ok ? \"YES\" : \"NO\");\n    return 0;\n}", "runs": [{"in": "level", "out": "YES"}, {"in": "abca", "out": "NO"}, {"in": "a", "out": "YES"}, {"in": "abcba", "out": "YES"}, {"in": "ab", "out": "NO"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> Single characters are compared with <code>!=</code>, which is fine: a <code>char</code> is a number. Only whole strings need <code>strcmp</code>. A word of length 1 is always a palindrome because the loop does not run at all. Only half of the word is visited.</div>"}]}, {"title": "Are two words anagrams?", "parts": [{"t": "html", "html": "<p>Two words are <b>anagrams</b> if one can be obtained from the other by rearranging the letters (<code>listen</code> and <code>silent</code>). Sorting both words would work, but counting is simpler and faster: add 1 to <code>cnt[c]</code> for each letter of the first word and subtract 1 for each letter of the second. If the words are anagrams, every counter ends at exactly 0.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;string.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">char</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">1001</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">[</span><span class=\"p-mi\">1001</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s %s\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-mi\">26</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-mi\">0</span><span class=\"p-p\">};</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\0'</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-sc\">'a'</span><span class=\"p-p\">]</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// a loop can also stop at the '\\0'</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-sc\">'\\0'</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">b</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-sc\">'a'</span><span class=\"p-p\">]</span><span class=\"p-o\">--</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">ok</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">26</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">c</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">c</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">!=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">ok</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%s</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">ok</span><span class=\"p-w\"> </span><span class=\"p-o\">?</span><span class=\"p-w\"> </span><span class=\"p-s\">\"YES\"</span><span class=\"p-w\"> </span><span class=\"p-o\">:</span><span class=\"p-w\"> </span><span class=\"p-s\">\"NO\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char a[1001], b[1001];\n    scanf(\"%s %s\", a, b);\n\n    int cnt[26] = {0};\n    for (int i = 0; a[i] != '\\0'; i++) cnt[a[i] - 'a']++;    // a loop can also stop at the '\\0'\n    for (int i = 0; b[i] != '\\0'; i++) cnt[b[i] - 'a']--;\n\n    int ok = 1;\n    for (int c = 0; c < 26; c++) {\n        if (cnt[c] != 0) ok = 0;\n    }\n    printf(\"%s\\n\", ok ? \"YES\" : \"NO\");\n    return 0;\n}", "runs": [{"in": "listen silent", "out": "YES"}, {"in": "abc abd", "out": "NO"}, {"in": "aab aba", "out": "YES"}, {"in": "a aa", "out": "NO"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> The loop <code>for (int i = 0; a[i] != '\\0'; i++)</code> walks to the end of the string without calling <code>strlen</code>. Words of different lengths are rejected automatically: the counters cannot all return to 0. This &ldquo;add for one side, subtract for the other&rdquo; trick for comparing the contents of two collections is useful in the last exercise.</div>"}]}], "exercises": [{"title": "Vowels, consonants and the reverse", "level": "Easy", "cls": "easy", "use": "Sections 1, 2", "statement": "Given a word made of lowercase letters, print how many vowels (<code>a e i o u</code>) and how many consonants it has, and then the word written backwards.", "input": ["One line with a word of lowercase English letters (length from 1 to 10<sup>5</sup>)."], "output": ["Line 1: the number of vowels and the number of consonants, separated by a space.", "Line 2: de>a2b3a4</code>; a run of length 1 is also written with its length). Then print the <b>longest run</b>: its letter and its length. If several runs have the maximum length, print the one that appears first.<br><br><b>Time limit:</b> about 1 second.", "input": ["One line with a string of lowercase English letters (length from 1 to 10<sup>6</sup>)."], "output": ["Line 1: the encoded string.", "Line 2: the letter and the length of the longest run, separated by a space."], "extra": "The encoded string can be longer than 10<sup>6</sup> characters (each run adds a number): do not build it in an array of the wrong size. You can print it piece by piece as you go.", "examples": [{"in": "aaabcc", "out": "a3b1c2\na 3"}, {"in": "z", "out": "z1\nz 1"}, {"in": "aabbbaaaa", "out": "a2b3a4\na 4"}, {"in": "abab", "out": "a1b1a1b1\na 1"}, {"in": "aabb", "out": "a2b2\na 2"}]}, {"title": "Anagram windows", "level": "Hard", "cls": "hard", "use": "Sections 2, 3, Example 2, Day 3 (prefix sums) and Day 4 (two pointers)", "statement": "You are given a text T and a pattern P. A <b>window</b> is a block of |P| consecutive characters of T (starting at position i, with positions numbered from 0). Count the windows that are an <b>anagram</b> of P (the same letters with the same counts, in any order), and print the position of the first such window, or &minus;1 if there is none.<br><br><b>Time limit:</b> about 1 second. Sorting or counting the letters of every window from scratch takes about |T| &middot; |P| steps, which is far too slow when both strings are long.", "input": ["Line 1: the text T, lowercase English letters, length from 1 to 10<sup>6</sup>.", "Line 2: the pattern P, lowercase English letters, length from 1 to |T|."], "output": ["Two integers separated by a space: the number of windows that are an anagram of P, and the position of the first one (or &minus;1)."], "extra": "", "examples": [{"in": "cbaebabacd\nabc", "out": "2 0"}, {"in": "aaaa\naa", "out": "3 0"}, {"in": "abc\nd", "out": "0 -1"}, {"in": "hello\nhello", "out": "1 0"}, {"in": "abab\nba", "out": "3 0"}, {"in": "xxabcxx\ncab", "out": "1 2"}]}]});

(window.LEARNC_DATA = window.LEARNC_DATA || []).push({"day": 8, "title": "Day 8", "sub": "Two-dimensional arrays (matrices)", "plan": "About 20 minutes of theory, 15 minutes reading and running the 2 examples, and 60 to 90 minutes on the 4 exercises. Exercises 3 and 4 work on matrices of up to 10<sup>6</sup> cells, so a loop over the whole matrix for every query is too slow.", "goals": ["Declare, read and print a matrix <code>a[i][j]</code>, and tell rows from columns without mixing the two indexes.", "Pick out special cells: a row, a column, the two diagonals, the border, and the neighbours of a cell.", "Use direction arrays (<code>dx</code>, <code>dy</code>) with a bounds check instead of writing four or eight copies of the same code.", "Extend prefix sums to two dimensions to answer sums of rectangles in constant time."], "theory": [{"title": "A matrix: rows and columns", "parts": [{"t": "html", "html": "<p>A <b>two-dimensional array</b> is a table. <code>int a[n][m]</code> has n <b>rows</b> and m <b>columns</b>, and <code>a[i][j]</code> is the cell in row <code>i</code> and column <code>j</code>. As always the numbering starts at 0: the first row is row 0, and the last cell is <code>a[n-1][m-1]</code>. The <b>first</b> index is the row, the <b>second</b> is the column. Mixing them up is the most common mistake with matrices.</p>\n<p>You walk through a matrix with two nested loops: the outer loop chooses the row, the inner loop goes along that row. Swap the roles of the two loops and you walk down the columns instead. As with one-dimensional arrays, a big matrix must be <b>global</b>, and its size must be at least (rows) &times; (columns) of the largest input: a matrix of 1000 &times; 1000 <code>int</code> values takes 4 MB, which is fine as a global array.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">101</span><span class=\"p-p\">][</span><span class=\"p-mi\">101</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// global: a[row][column], up to 100 rows and 100 columns</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d %d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">m</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">][</span><span class=\"p-n\">j</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// the sum of every row</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">s</span><span class=\"p-w\"> </span><span class=\"p-o\">+=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">][</span><span class=\"p-n\">j</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"row %d: %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// the sum of every column: the loops change roles</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">s</span><span class=\"p-w\"> </span><span class=\"p-o\">+=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">][</span><span class=\"p-n\">j</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"column %d: %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">s</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint a[101][101];                 // global: a[row][column], up to 100 rows and 100 columns\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < m; j++) {\n            scanf(\"%d\", &a[i][j]);\n        }\n    }\n\n    for (int i = 0; i < n; i++) {            // the sum of every row\n        int s = 0;\n        for (int j = 0; j < m; j++) s += a[i][j];\n        printf(\"row %d: %d\\n\", i, s);\n    }\n    for (int j = 0; j < m; j++) {            // the sum of every column: the loops change roles\n        int s = 0;\n        for (int i = 0; i < n; i++) s += a[i][j];\n        printf(\"column %d: %d\\n\", j, s);\n    }\n    return 0;\n}", "runs": [{"in": "2 3\n1 2 3\n4 5 6", "out": "row 0: 6\nrow 1: 15\ncolumn 0: 5\ncolumn 1: 7\ncolumn 2: 9"}, {"in": "1 1\n7", "out": "row 0: 7\ncolumn 0: 7"}]}, {"t": "html", "html": "<p>When you pass a matrix to a function, the compiler must know the number of columns, because it needs it to find the start of each row. Write the size of the second dimension, and leave the first one empty:</p>"}, {"t": "snippet", "html": "<span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-nf\">printMatrix</span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[][</span><span class=\"p-mi\">101</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// 101 = the number of columns of the array</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d \"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">][</span><span class=\"p-n\">j</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-p\">}</span>", "raw": "void printMatrix(int a[][101], int n, int m) {   // 101 = the number of columns of the array\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < m; j++) printf(\"%d \", a[i][j]);\n        printf(\"\\n\");\n    }\n}"}, {"t": "html", "html": "<div class=\"box note\"><b>Same as Day 5.</b> A function that receives a matrix works on the <b>original</b>, not on a copy. If <code>printMatrix</code> changed an element, the matrix in <code>main</code> would change too.</div>"}]}, {"title": "Diagonals, borders and the transpose", "parts": [{"t": "html", "html": "<p>In a square matrix (n rows and n columns) many special groups of cells have a simple condition on the two indexes:</p>\n<ul>\n<li>the <b>main diagonal</b> (from top left to bottom right): <code>i == j</code></li>\n<li>the <b>anti-diagonal</b> (from top right to bottom left): <code>i + j == n - 1</code></li>\n<li>the <b>border</b>: <code>i == 0 || i == n - 1 || j == 0 || j == n - 1</code></li>\n<li>the cells <b>above</b> the main diagonal: <code>j &gt; i</code>; below it: <code>j &lt; i</code></li>\n</ul>\n<p>The <b>transpose</b> swaps rows and columns: the new <code>a[i][j]</code> is the old <code>a[j][i]</code>. To do it in place, swap each pair of symmetric cells <b>once</b>, for example only when <code>j &gt; i</code>. If you swap in a loop over the whole matrix, every pair is swapped twice and nothing changes.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">101</span><span class=\"p-p\">][</span><span class=\"p-mi\">101</span><span class=\"p-p\">];</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">][</span><span class=\"p-n\">j</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">d1</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">d2</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\" </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d \"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">][</span><span class=\"p-n\">j</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint a[101][101];\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++)\n            scanf(\"%d\", &a[i][j]);\n\n    int d1 = 0, d2 = 0;\n    for (int i = 0; i < n; i++) {\n        d1 += a[i][i];               // main diagonal: only n cells, so one loop is enough\n        d2 += a[i][n - 1 - i];       // anti-diagonal: j = n - 1 - i\n    }\n    printf(\"main diagonal: %d\\n\", d1);\n    printf(\"anti-diagonal: %d\\n\", d2);\n\n    for (int i = 0; i < n; i++) {    // transpose: swap each pair (i, j) and (j, i) once\n        for (int j = i + 1; j < n; j++) {\n            int t = a[i][j];\n            a[i][j] = a[j][i];\n            a[j][i] = t;\n        }\n    }\n    printf(\"transposed:\\n\");\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < n; j++) printf(\"%d \", a[i][j]);\n        printf(\"\\n\");\n    }\n    return 0;\n}", "runs": [{"in": "3\n1 2 3\n4 5 6\n7 8 9", "out": "main diagonal: 15\nanti-diagonal: 15\ntransposed:\n1 4 7 \n2 5 8 \n3 6 9 "}, {"in": "1\n5", "out": "main diagonal: 5\nanti-diagonal: 5\ntransposed:\n5 "}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> A diagonal has only n cells, so you do not need two nested loops (which would test n&sup2; cells to keep n of them): one loop with the second index computed from the first is faster and simpler. In a matrix with an odd size the two diagonals share the center cell.</div>"}]}, {"title": "Neighbours and direction arrays", "parts": [{"t": "html", "html": "<p>Many problems look at the cells next to a cell: up, down, left and right. Writing four copies of the same code is long and error-prone. Instead keep the four <b>moves</b> in two small arrays: <code>dx[d]</code> is the change of the row and <code>dy[d]</code> the change of the column for direction number d. Then the neighbour of <code>(i, j)</code> in direction d is <code>(i + dx[d], j + dy[d])</code>, and one loop <code>for (int d = 0; d &lt; 4; d++)</code> visits all of them. For the 8 neighbours (with the diagonals) use arrays of 8 moves.</p>\n<p>Cells on the border have fewer neighbours: a neighbour outside the matrix must be skipped. <b>Always check the bounds before reading the cell</b>: <code>a[-1][3]</code> is not an error message, it is silent garbage.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span clas
