(window.LEARNC_DATA = window.LEARNC_DATA || []).push({"day": 3, "title": "Day 3", "sub": "One-dimensional arrays: reading, scanning, counting, prefix sums", "plan": "About 20 minutes of theory, 15 minutes reading and running the 2 examples, and 60 to 90 minutes on the 4 exercises. Exercises 3 and 4 have time limits: a slow double loop will not pass.", "goals": ["Declare an array, fill it with <code>scanf</code>, and print it, always staying inside positions 0 to n-1.", "Scan an array for a sum, a maximum (and where it is), a count, and reverse it in place with two indices.", "Use a <b>frequency array</b> (<code>cnt[value]++</code>) to count things in one pass instead of comparing every pair.", "Use <b>prefix sums</b> to answer &ldquo;sum of a segment&rdquo; in O(1) after one pass."], "theory": [{"title": "Arrays: declare, read, print", "parts": [{"t": "html", "html": "<p>An array stores many values of the same type under one name. <code>int a[5];</code> creates five ints, called <code>a[0]</code>, <code>a[1]</code>, ..., <code>a[4]</code>. Positions start at <b>0</b>, so the last valid position of an array of size n is <b>n-1</b>. The pattern for reading and printing is always a loop from 0 to n-1.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">100</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// room for up to 100 numbers</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-n\">sum</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// i = 0, 1, ..., n-1</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// &amp; is needed, a[i] is a single int</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">sum</span><span class=\"p-w\"> </span><span class=\"p-o\">+=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\" \"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"sum = %lld, average = %.2f</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">sum</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">double</span><span class=\"p-p\">)</span><span class=\"p-n\">sum</span><span class=\"p-w\"> </span><span class=\"p-o\">/</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint main() {\n    int n;\n    int a[100];                      // room for up to 100 numbers\n    scanf(\"%d\", &n);\n\n    long long sum = 0;\n    for (int i = 0; i < n; i++) {    // i = 0, 1, ..., n-1\n        scanf(\"%d\", &a[i]);          // & is needed, a[i] is a single int\n        sum += a[i];\n    }\n\n    for (int i = 0; i < n; i++) {\n        if (i > 0) printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    printf(\"sum = %lld, average = %.2f\\n\", sum, (double)sum / n);\n    return 0;\n}", "runs": [{"in": "5\n4 8 15 16 23", "out": "4 8 15 16 23\nsum = 66, average = 13.20"}]}, {"t": "html", "html": "<ul>\n<li><b>The size must be a constant</b> that is at least as large as the biggest n in the problem. If n can be 100000, write <code>a[100000]</code> (or a little more).</li>\n<li><b>C does not check positions.</b> Writing <code>a[100]</code> in an array of size 100 does not give an error message, it silently damages other memory. Wrong results or a crash may appear far from the real bug.</li>\n<li><b>Big arrays go outside <code>main</code></b> (global). Local arrays live on a small stack, and something like <code>int a[1000000]</code> inside <code>main</code> may crash. Global arrays are also filled with 0 at the start.</li>\n<li>A local array is <i>not</i> zeroed. To start with all zeros write <code>int cnt[11] = {0};</code>.</li>\n<li><code>(double)sum / n</code> converts first, so the division is a real division (Day 1).</li>\n</ul>"}]}, {"title": "Scanning an array", "parts": [{"t": "html", "html": "<p>Almost every array problem is a loop over the positions with one of the patterns from Day 2: counter, sum, maximum, flag. For the maximum it is often more useful to remember the <b>position</b> of the best element, because then you also know the value: <code>a[best]</code>. To <b>reverse</b> an array in place, use two indices that start at both ends and move toward each other, swapping as they go.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">100</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">best</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// position of the maximum so far</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">best</span><span class=\"p-p\">])</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">best</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// strictly greater: keeps the FIRST maximum</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"max = %d at position %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">best</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">best</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">--</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// two indices, one loop</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">tmp</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// swap needs a temporary variable</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">j</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">j</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">tmp</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d \"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint main() {\n    int n;\n    int a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n\n    int best = 0;                          // position of the maximum so far\n    for (int i = 1; i < n; i++) {\n        if (a[i] > a[best]) best = i;      // strictly greater: keeps the FIRST maximum\n    }\n    printf(\"max = %d at position %d\\n\", a[best], best);\n\n    for (int i = 0, j = n - 1; i < j; i++, j--) {   // two indices, one loop\n        int tmp = a[i];                    // swap needs a temporary variable\n        a[i] = a[j];\n        a[j] = tmp;\n    }\n    for (int i = 0; i < n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}", "runs": [{"in": "6\n4 9 2 9 1 7", "out": "max = 9 at position 1\n7 1 9 2 9 4 "}]}, {"t": "html", "html": "<div class=\"box note\"><b>Why <code>i &lt; j</code>?</b> When the two indices meet or cross, every pair has already been swapped. Going on would swap everything back. In the example above, n = 6 gives three swaps: (0,5), (1,4), (2,3). The temporary variable <code>tmp</code> must be assigned <i>before</i> it is used (a bug we met in Day 1).</div>"}]}, {"title": "Frequency arrays: counting in one pass", "parts": [{"t": "html", "html": "<p>Suppose you want to know how many times each value appears. Comparing every element with every other one is slow. Instead, use the <b>value itself as the position</b>: <code>cnt[v]</code> stores how many times v was seen. Each new number does just <code>cnt[v]++</code>. Afterwards, one loop over the possible values reads the answer.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-mi\">11</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-mi\">0</span><span class=\"p-p\">};</span><span class=\"p-w\">  </span><span class=\"p-c1\">// values are marks from 0 to 10</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">v</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">v</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">v</span><span class=\"p-p\">]</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// the value v is the position</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">v</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">v</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;=</span><span class=\"p-w\"> </span><span class=\"p-mi\">10</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">v</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">v</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d appears %d times</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">v</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">v</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n\n    int cnt[11] = {0};              // values are marks from 0 to 10\n    for (int i = 0; i < n; i++) {\n        int v;\n        scanf(\"%d\", &v);\n        cnt[v]++;                   // the value v is the position\n    }\n\n    for (int v = 0; v <= 10; v++) {\n        if (cnt[v] > 0) printf(\"%d appears %d times\\n\", v, cnt[v]);\n    }\n    return 0;\n}", "runs": [{"in": "8\n3 7 3 10 0 7 3 3", "out": "0 appears 1 times\n3 appears 4 times\n7 appears 2 times\n10 appears 1 times"}]}, {"t": "html", "html": "<ul>\n<li>The array must be large enough for the <b>biggest value</b>, not for n. Values up to 1000000 need <code>cnt[1000001]</code>.</li>\n<li><b>Negative values</b> cannot be positions. Add an <b>offset</b>: if values are between -10 and 10, use <code>cnt[v + 10]</code>.</li>\n<li>Counting while reading lets you answer questions about the elements that came <i>before</i> the current one, for example &ldquo;how many earlier elements equal S - x?&rdquo; is simply <code>cnt[S - x]</code> (check the position is in range first).</li>\n</ul>"}]}, {"title": "Prefix sums", "parts": [{"t": "html", "html": "<p>Suppose you must answer many questions of the form &ldquo;what is the sum of the elements from position l to position r?&rdquo;. Adding them up each time costs up to n steps per question. Instead, build once an array <code>pre</code> where <code>pre[i]</code> is the sum of the first i elements. Then any segment sum is a single subtraction. It is easiest to number the elements from 1 and keep <code>pre[0] = 0</code>:</p>"}, {"t": "snippet", "html": "<span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-mi\">100001</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// global: pre[0] = 0</span>\n<span class=\"p-c1\">// reading a[1..n]:</span>\n<span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;=</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">x</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// sum of the first i elements</span>\n<span class=\"p-p\">}</span>\n<span class=\"p-c1\">// sum of a[l..r]  =  pre[r] - pre[l - 1]</span>", "raw": "long long pre[100001];            // global: pre[0] = 0\n// reading a[1..n]:\nfor (int i = 1; i <= n; i++) {\n    int x;\n    scanf(\"%d\", &x);\n    pre[i] = pre[i - 1] + x;      // sum of the first i elements\n}\n// sum of a[l..r]  =  pre[r] - pre[l - 1]"}, {"t": "html", "html": "<div class=\"box note\"><b>Why does it work?</b> <code>pre[r]</code> is everything up to r. <code>pre[l-1]</code> is everything before l. What remains is exactly the elements l to r. The leading <code>pre[0] = 0</code> makes l = 1 work without a special case. Use <code>long long</code>: the sum of 10<sup>5</sup> numbers up to 10<sup>9</sup> does not fit in an int.</div>\n<div class=\"box warn\"><b>Be careful with sizes.</b> If there are 2 &middot; 10<sup>5</sup> elements, the loops must be about n steps, not n &times; n steps. A double loop over n = 10<sup>5</sup> is 10<sup>10</sup> operations, far too slow. The last two exercises are built so that only the one-pass ideas of this lesson are fast enough.</div>"}]}], "examples": [{"title": "Range sums", "parts": [{"t": "html", "html": "<p>First the array of numbers, then Q questions. Each question gives l and r, and you print the sum of positions l to r (numbered from 1). Read the code, then <b>compute the three answers by hand</b> before looking at the output.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-mi\">100001</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// global: starts as all zeros</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">q</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d %d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">q</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;=</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">x</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// build the prefix sums while reading</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">q</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">l</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">r</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d %d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">l</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">r</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%lld</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-n\">r</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-n\">pre</span><span class=\"p-p\">[</span><span class=\"p-n\">l</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// O(1) per question</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nlong long pre[100001];                  // global: starts as all zeros\n\nint main() {\n    int n, q;\n    scanf(\"%d %d\", &n, &q);\n\n    for (int i = 1; i <= n; i++) {\n        int x;\n        scanf(\"%d\", &x);\n        pre[i] = pre[i - 1] + x;        // build the prefix sums while reading\n    }\n\n    for (int k = 0; k < q; k++) {\n        int l, r;\n        scanf(\"%d %d\", &l, &r);\n        printf(\"%lld\\n\", pre[r] - pre[l - 1]);   // O(1) per question\n    }\n    return 0;\n}", "runs": [{"in": "8 3\n5 -2 7 1 0 4 -3 6\n1 8\n3 5\n6 6", "out": "18\n8\n4"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> The array is global, so <code>pre[0]</code> is already 0. The whole program does about n + Q steps, so it stays fast even for n = Q = 200000, while the &ldquo;add the numbers each time&rdquo; method would take n &times; Q steps. We do not even need to store the original numbers: only the running total matters.</div>"}]}, {"title": "Pairs of equal neighbours and equal elements", "parts": [{"t": "html", "html": "<p>Count how many pairs of positions i &lt; j have equal values. The slow way uses two nested loops. The fast way uses a frequency array: when you reach a value, every earlier copy of it forms a new pair with it. This is the idea behind exercises 3 and 4.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-mi\">1001</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// values are between 0 and 1000</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-n\">pairs</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">x</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">pairs</span><span class=\"p-w\"> </span><span class=\"p-o\">+=</span><span class=\"p-w\"> </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">x</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// earlier copies of x: each makes a pair</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">cnt</span><span class=\"p-p\">[</span><span class=\"p-n\">x</span><span class=\"p-p\">]</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// now x is also an \"earlier\" copy</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%lld</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">pairs</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint cnt[1001];                          // values are between 0 and 1000\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n\n    long long pairs = 0;\n    for (int i = 0; i < n; i++) {\n        int x;\n        scanf(\"%d\", &x);\n        pairs += cnt[x];                // earlier copies of x: each makes a pair\n        cnt[x]++;                       // now x is also an \"earlier\" copy\n    }\n    printf(\"%lld\\n\", pairs);\n    return 0;\n}", "runs": [{"in": "6\n5 3 5 5 3 9", "out": "4"}, {"in": "4\n1 2 3 4", "out": "0"}, {"in": "5\n7 7 7 7 7", "out": "10"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> The order of the two lines matters: first <i>use</i> <code>cnt[x]</code>, then <i>increase</i> it. If you increase first, an element would be counted as a pair with itself. For 5 3 5 5 3 9: the second 5 pairs with 1 earlier 5, the third 5 with 2, the second 3 with 1, so the total is 1 + 2 + 1 = 4. With five equal values, the answer is 0+1+2+3+4 = 10. The result can reach about n<sup>2</sup>/2, so it is <code>long long</code>.</div>"}]}], "exercises": [{"title": "Statistics of an array", "level": "Easy", "cls": "easy", "use": "Sections 1, 2", "statement": "Given n integers, find the smallest one, the largest one, their sum, and how many of the numbers are strictly greater than the average of all the numbers.", "input": ["Line 1: an integer n (1 &le; n &le; 10<sup>5</sup>).", "Line 2: n integers, each between -10<sup>9</sup> and 10<sup>9</sup>."], "output": ["Four integers separated by spaces: the minimum, the maximum, the sum, and the count of numbers strictly greater than the average."], "extra": "Think about which type holds the sum. You may compare <i>x</i> with the average without any decimal numbers, if you remember that x &gt; sum / n means the same as x &middot; n &gt; sum (for n &gt; 0).", "examples": [{"in": "5\n3 1 4 1 5", "out": "1 5 14 3"}, {"in": "1\n-7", "out": "-7 -7 -7 0"}, {"in": "4\n2 2 2 2", "out": "2 2 8 0"}, {"in": "6\n-5 10 0 3 -2 8", "out": "-5 10 14 3"}]}, {"title": "Rotate the array", "level": "Easy - Medium", "cls": "easymed", "use": "Sections 1, 2", "statement": "Rotating an array to the right by k means: every element moves k positions to the right, and the elements that fall off the end re-enter from the start. For example, rotating 1 2 3 4 5 right by 2 gives 4 5 1 2 3.<br><br>Given an array and k, print the rotated array. Note that k can be much larger than n.", "input": ["Line 1: two integers n and k (1 &le; n &le; 10<sup>5</sup>, 0 &le; k &le; 10<sup>9</sup>).", "Line 2: n integers, each between -10<sup>9</sup> and 10<sup>9</sup>."], "output": ["One line with the n numbers of the rotated array, separated by single spaces, with no space at the end of the line."], "extra": "", "examples": [{"in": "5 2\n1 2 3 4 5", "out": "4 5 1 2 3"}, {"in": "4 0\n7 8 9 10", "out": "7 8 9 10"}, {"in": "3 1000000000\n1 2 3", "out": "3 1 2"}, {"in": "1 5\n42", "out": "42"}]}, {"title": "Pairs with a given sum", "level": "Medium", "cls": "med", "use": "Section 3, Example 2", "statement": "Given n numbers and a target S, count the pairs of positions (i, j) with i &lt; j such that a[i] + a[j] = S. Two different positions that hold equal values are different pairs.<br><br><b>Time limit:</b> about 1 second. For n = 10<sup>5</sup> a loop over all pairs is far too slow.", "input": ["Line 1: two integers n and S (1 &le; n &le; 10<sup>5</sup>, 0 &le; S &le; 2 &middot; 10<sup>6</sup>).", "Line 2: n integers, each between 0 and 10<sup>6</sup>."], "output": ["One integer: the number of pairs (i, j) with i &lt; j and a[i] + a[j] = S."], "extra": "Take care: the partner value S - x may be negative or larger than 10<sup>6</sup>. And the answer can be about 5 &middot; 10<sup>9</sup>.", "examples": [{"in": "5 6\n1 5 3 3 3", "out": "4"}, {"in": "4 10\n1 2 3 4", "out": "0"}, {"in": "6 4\n2 2 2 2 2 2", "out": "15"}, {"in": "5 0\n0 0 5 0 3", "out": "3"}]}, {"title": "Zero-sum segments", "level": "Hard", "cls": "hard", "use": "Sections 3, 4, Example 2", "statement": "A <b>segment</b> is a block of consecutive elements a[l], a[l+1], ..., a[r]. Given an array, count the segments whose sum is exactly 0, and find the length of the longest such segment (print 0 if there is none).<br><br>For example, in the array 1 -1 2 -2 0 there are 6 zero-sum segments: (1,-1), (2,-2), (0), (1,-1,2,-2), (2,-2,0) and (1,-1,2,-2,0). The longest one is the whole array, of length 5.<br><br><b>Time limit:</b> about 1 second for n = 10<sup>5</sup>. Checking every segment, even with a prefix-sum formula, takes about n<sup>2</sup>/2 = 5 &middot; 10<sup>9</sup> steps and is too slow. Look for a way that remembers something about the prefix sums seen so far.", "input": ["Line 1: an integer n (1 &le; n &le; 10<sup>5</sup>).", "Line 2: n integers, each between -10 and 10."], "output": ["Two integers separated by a space: the number of zero-sum segments, and the length of the longest one (0 if none)."], "extra": "The count can be about 5 &middot; 10<sup>9</sup>, so use <code>long long</code>. All prefix sums lie between -10<sup>6</sup> and 10<sup>6</sup>.", "examples": [{"in": "5\n1 -1 2 -2 0", "out": "6 5"}, {"in": "3\n1 2 3", "out": "0 0"}, {"in": "4\n0 0 0 0", "out": "10 4"}, {"in": "6\n3 -3 3 -3 3 -3", "out": "9 6"}]}]});

(window.LEARNC_DATA = window.LEARNC_DATA || []).push({"day": 4, "title": "Day 4", "sub": "Sorting and searching: qsort, binary search, two pointers", "plan": "About 20 minutes of theory, 15 minutes reading and running the 2 examples, and 60 to 90 minutes on the 4 exercises. Exercises 3 and 4 have time limits: slow loops will not pass.", "goals": ["Sort a small array by hand with selection sort, and understand why it is too slow for 10<sup>5</sup> numbers.", "Sort big arrays with <code>qsort</code> and write a correct comparison function.", "Search a sorted array in about 17 steps instead of 10<sup>5</sup> with <b>binary search</b>.", "Use a sorted array to find groups of equal values, close pairs and pair sums with <b>two pointers</b>."], "theory": [{"title": "Simple sorting: selection sort", "parts": [{"t": "html", "html": "<p>To <b>sort</b> is to rearrange the elements so that they are in order. The simplest idea, <b>selection sort</b>: find the smallest element of the whole array and swap it into position 0; then find the smallest of the rest and swap it into position 1; and so on. Each round fixes one more position for good.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">100</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">m</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// position of the smallest in a[i..n-1]</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">j</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">m</span><span class=\"p-p\">])</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">                </span><span class=\"p-n\">m</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">j</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">            </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">tmp</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// swap a[i] and a[m]</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">m</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">m</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">tmp</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d \"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint main() {\n    int n, a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n\n    for (int i = 0; i < n - 1; i++) {\n        int m = i;                          // position of the smallest in a[i..n-1]\n        for (int j = i + 1; j < n; j++) {\n            if (a[j] < a[m]) m = j;\n        }\n        int tmp = a[i];                     // swap a[i] and a[m]\n        a[i] = a[m];\n        a[m] = tmp;\n    }\n\n    for (int i = 0; i < n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}", "runs": [{"in": "6\n5 2 9 1 5 6", "out": "1 2 5 5 6 9 "}]}, {"t": "html", "html": "<div class=\"box warn\"><b>Too slow for big data.</b> The two nested loops make about n&sup2;/2 comparisons. For n = 1000 that is 500 thousand steps (instant). For n = 10<sup>5</sup> it is 5 billion steps, far over a 1 second limit. Selection sort (and its cousins bubble sort and insertion sort) is fine for a few thousand numbers. For more, use <code>qsort</code>, which needs only about n &middot; log<sub>2</sub> n steps (about 1.7 million for n = 10<sup>5</sup>).</div>"}]}, {"title": "qsort: the built-in sort", "parts": [{"t": "html", "html": "<p>The standard library has <code>qsort</code> (in <code>&lt;stdlib.h&gt;</code>). You give it the array, the number of elements, the size of one element, and a <b>comparison function</b> that says which of two elements comes first. The function receives two pointers; the line <code>*(const int *)p</code> reads the <code>int</code> that <code>p</code> points to. You can copy this pattern as it is today; pointers are taught in Day 11.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdlib.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">cmp</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-n\">p</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-n\">q</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">)</span><span class=\"p-n\">p</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">)</span><span class=\"p-n\">q</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">-1</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// negative: a goes first</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// positive: b goes first</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// equal</span>\n<span class=\"p-p\">}</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">100000</span><span class=\"p-p\">];</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-n\">qsort</span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">sizeof</span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-p\">),</span><span class=\"p-w\"> </span><span class=\"p-n\">cmp</span><span class=\"p-p\">);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// sorts a[0..n-1] in increasing order</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\" \"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <stdlib.h>\n\nint cmp(const void *p, const void *q) {\n    int a = *(const int *)p;\n    int b = *(const int *)q;\n    if (a < b) return -1;       // negative: a goes first\n    if (a > b) return 1;        // positive: b goes first\n    return 0;                   // equal\n}\n\nint a[100000];\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n\n    qsort(a, n, sizeof(int), cmp);     // sorts a[0..n-1] in increasing order\n\n    for (int i = 0; i < n; i++) {\n        if (i > 0) printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}", "runs": [{"in": "7\n5 -2 9 1000000000 -1000000000 0 5", "out": "-1000000000 -2 0 5 5 9 1000000000"}]}, {"t": "html", "html": "<ul>\n<li><b>Descending order:</b> swap the roles, <code>if (a &gt; b) return -1; if (a &lt; b) return 1;</code>.</li>\n<li><b>Do not write <code>return a - b;</code></b>. It looks shorter, but <code>1000000000 - (-1000000000)</code> overflows an <code>int</code> and gives a wrong order.</li>\n<li>For <code>long long</code> arrays change the type everywhere: <code>*(const long long *)p</code> and <code>sizeof(long long)</code>.</li>\n<li><b>Sorting positions instead of values.</b> Sometimes you need to keep the original positions. Sort an array <code>idx</code> of positions, and in <code>cmp</code> compare <code>pre[a]</code> and <code>pre[b]</code> (the values at those positions) instead of <code>a</code> and <code>b</code>, as in the zero-sum solution from Day 3.</li>\n</ul>"}]}, {"title": "Binary search", "parts": [{"t": "html", "html": "<p>If an array is sorted, you can find a value without looking at every element. Look at the <b>middle</b> element. If it is too small, the answer must be in the right half; otherwise in the left half. Each step halves the search area, so n = 10<sup>5</sup> needs only about 17 steps (and 10<sup>9</sup> needs about 30).</p>\n<p>The most useful form is <b>lower bound</b>: the position of the first element that is <b>&ge; x</b> (it is n if all elements are smaller). From it you get a lot: <code>lower_bound(x)</code> is the number of elements smaller than x; and the number of elements equal to x is <code>lower_bound(x + 1) - lower_bound(x)</code> (for integers). Functions are taught in Day 5; for now read this one as a ready-made tool.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">100000</span><span class=\"p-p\">];</span><span class=\"p-w\">  </span><span class=\"p-c1\">// must be sorted in increasing order</span>\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">lower_bound</span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span><span class=\"p-w\">  </span><span class=\"p-c1\">// first position with a[pos] &gt;= x, or n if none</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">lo</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">hi</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// the answer is always in lo..hi</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">while</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">lo</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">hi</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">mid</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">lo</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">hi</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-n\">lo</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-o\">/</span><span class=\"p-w\"> </span><span class=\"p-mi\">2</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">mid</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">lo</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">mid</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// mid is too small: answer is to the right</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span><span class=\"p-w\"> </span><span class=\"p-k\">else</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">hi</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">mid</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// a[mid] &gt;= x: mid could be the answer</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-n\">lo</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">q</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d %d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">q</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span><span class=\"p-w\">  </span><span class=\"p-c1\">// given already sorted</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">q</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">k</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">x</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">x</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">lower_bound</span><span class=\"p-p\">(</span><span class=\"p-n\">x</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-n\">lower_bound</span><span class=\"p-p\">(</span><span class=\"p-n\">x</span><span class=\"p-p\">));</span><span class=\"p-w\">  </span><span class=\"p-c1\">// how many times x occurs</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n\nint a[100000];                 // must be sorted in increasing order\nint n;\n\nint lower_bound(int x) {       // first position with a[pos] >= x, or n if none\n    int lo = 0, hi = n;        // the answer is always in lo..hi\n    while (lo < hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (a[mid] < x) lo = mid + 1;   // mid is too small: answer is to the right\n        else hi = mid;                  // a[mid] >= x: mid could be the answer\n    }\n    return lo;\n}\n\nint main() {\n    int q;\n    scanf(\"%d %d\", &n, &q);\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);   // given already sorted\n\n    for (int k = 0; k < q; k++) {\n        int x;\n        scanf(\"%d\", &x);\n        printf(\"%d\\n\", lower_bound(x + 1) - lower_bound(x));   // how many times x occurs\n    }\n    return 0;\n}", "runs": [{"in": "8 4\n1 3 3 5 7 7 7 9\n3 7 4 10", "out": "2\n3\n0\n0"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Why <code>lo &lt; hi</code> and <code>hi = mid</code>?</b> The answer is somewhere in lo..hi (hi = n means &ldquo;none&rdquo;). If <code>a[mid] &lt; x</code>, then mid and everything left of it are too small, so <code>lo = mid + 1</code>. Otherwise mid could itself be the first good position, so we keep it: <code>hi = mid</code>. The area shrinks every round and the loop ends when lo meets hi. <code>lo + (hi - lo) / 2</code> is the middle without risk of overflow. Binary search only works on sorted data.</div>"}]}, {"title": "What a sorted array gives you", "parts": [{"t": "html", "html": "<p>Once an array is sorted, <b>equal values stand next to each other</b>, so you can handle each group of equal values with one scan, without a frequency array. This works even when the values are huge or negative, where an array indexed by value is impossible. The scan below walks over groups: <code>i</code> marks the start of a group and <code>j</code> runs to the end of it.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdlib.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">cmp</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-n\">p</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-n\">q</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">)</span><span class=\"p-n\">p<
