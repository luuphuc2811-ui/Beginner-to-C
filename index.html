-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">where</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">where</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">where</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <stdlib.h>\n\nint cmp(const void *p, const void *q) {\n    long long a = *(const long long *)p, b = *(const long long *)q;\n    if (a < b) return -1;\n    if (a > b) return 1;\n    return 0;\n}\n\nlong long a[100000];\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n; i++) scanf(\"%lld\", &a[i]);\n    qsort(a, n, sizeof(long long), cmp);\n\n    int where = 0;                          // the pair is a[where], a[where + 1]\n    for (int i = 1; i + 1 < n; i++) {\n        if (a[i + 1] - a[i] < a[where + 1] - a[where]) where = i;\n    }\n    printf(\"smallest difference = %lld, between %lld and %lld\\n\",\n           a[where + 1] - a[where], a[where], a[where + 1]);\n    return 0;\n}", "runs": [{"in": "6\n40 7 22 15 31 9", "out": "smallest difference = 2, between 7 and 9"}, {"in": "5\n8 8 3 20 1", "out": "smallest difference = 0, between 8 and 8"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> After sorting, only <code>n - 1</code> adjacent pairs have to be checked, so the whole program costs about n &middot; log n steps. We remember the <i>position</i> of the best pair (<code>where</code>) rather than the difference, like the position of the maximum on Day 3. For 8 8 3 20 1 the smallest difference is 0: equal numbers become neighbours after sorting.</div>"}]}, {"title": "Two pointers: a pair with a given sum", "parts": [{"t": "html", "html": "<p>Is there a pair of elements whose sum is exactly S? Sort the array, put one pointer <code>lo</code> at the smallest element and one pointer <code>hi</code> at the largest, and look at their sum. If the sum is too small, the smallest element cannot work with <i>any</i> remaining partner (even the largest is not enough), so <code>lo++</code>. If the sum is too big, the largest element cannot work with any remaining partner, so <code>hi--</code>. Each step discards one element, so there are at most n steps.</p>"}, {"t": "code", "html": "<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdio.h&gt;</span>\n<span class=\"p-cp\">#include</span><span class=\"p-w\"> </span><span class=\"p-cpf\">&lt;stdlib.h&gt;</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">cmp</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-n\">p</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">void</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-n\">q</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">)</span><span class=\"p-n\">p</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">(</span><span class=\"p-k\">const</span><span class=\"p-w\"> </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-o\">*</span><span class=\"p-p\">)</span><span class=\"p-n\">q</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">-1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-w\"> </span><span class=\"p-o\">&gt;</span><span class=\"p-w\"> </span><span class=\"p-n\">b</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-mi\">100000</span><span class=\"p-p\">];</span>\n\n<span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-nf\">main</span><span class=\"p-p\">()</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-n\">S</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d %lld\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">S</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">for</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">;</span><span class=\"p-w\"> </span><span class=\"p-n\">i</span><span class=\"p-o\">++</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">scanf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"%d\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-o\">&amp;</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">i</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-n\">qsort</span><span class=\"p-p\">(</span><span class=\"p-n\">a</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-k\">sizeof</span><span class=\"p-p\">(</span><span class=\"p-kt\">int</span><span class=\"p-p\">),</span><span class=\"p-w\"> </span><span class=\"p-n\">cmp</span><span class=\"p-p\">);</span>\n\n<span class=\"p-w\">    </span><span class=\"p-kt\">int</span><span class=\"p-w\"> </span><span class=\"p-n\">lo</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">hi</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-n\">n</span><span class=\"p-w\"> </span><span class=\"p-o\">-</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">found</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">while</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">lo</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">hi</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-n\">sum</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-kt\">long</span><span class=\"p-w\"> </span><span class=\"p-kt\">long</span><span class=\"p-p\">)</span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">lo</span><span class=\"p-p\">]</span><span class=\"p-w\"> </span><span class=\"p-o\">+</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">hi</span><span class=\"p-p\">];</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">sum</span><span class=\"p-w\"> </span><span class=\"p-o\">==</span><span class=\"p-w\"> </span><span class=\"p-n\">S</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">found</span><span class=\"p-w\"> </span><span class=\"p-o\">=</span><span class=\"p-w\"> </span><span class=\"p-mi\">1</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">            </span><span class=\"p-k\">break</span><span class=\"p-p\">;</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">        </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">sum</span><span class=\"p-w\"> </span><span class=\"p-o\">&lt;</span><span class=\"p-w\"> </span><span class=\"p-n\">S</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">lo</span><span class=\"p-o\">++</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// too small: a[lo] cannot be part of any pair</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span><span class=\"p-w\"> </span><span class=\"p-k\">else</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">            </span><span class=\"p-n\">hi</span><span class=\"p-o\">--</span><span class=\"p-p\">;</span><span class=\"p-w\">  </span><span class=\"p-c1\">// too big: a[hi] cannot be part of any pair</span>\n<span class=\"p-w\">        </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">if</span><span class=\"p-w\"> </span><span class=\"p-p\">(</span><span class=\"p-n\">found</span><span class=\"p-p\">)</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"YES %d %d</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">,</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">lo</span><span class=\"p-p\">],</span><span class=\"p-w\"> </span><span class=\"p-n\">a</span><span class=\"p-p\">[</span><span class=\"p-n\">hi</span><span class=\"p-p\">]);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span><span class=\"p-w\"> </span><span class=\"p-k\">else</span><span class=\"p-w\"> </span><span class=\"p-p\">{</span>\n<span class=\"p-w\">        </span><span class=\"p-n\">printf</span><span class=\"p-p\">(</span><span class=\"p-s\">\"NO</span><span class=\"p-se\">\\n</span><span class=\"p-s\">\"</span><span class=\"p-p\">);</span>\n<span class=\"p-w\">    </span><span class=\"p-p\">}</span>\n<span class=\"p-w\">    </span><span class=\"p-k\">return</span><span class=\"p-w\"> </span><span class=\"p-mi\">0</span><span class=\"p-p\">;</span>\n<span class=\"p-p\">}</span>", "raw": "#include <stdio.h>\n#include <stdlib.h>\n\nint cmp(const void *p, const void *q) {\n    int a = *(const int *)p, b = *(const int *)q;\n    if (a < b) return -1;\n    if (a > b) return 1;\n    return 0;\n}\n\nint a[100000];\n\nint main() {\n    int n;\n    long long S;\n    scanf(\"%d %lld\", &n, &S);\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n    qsort(a, n, sizeof(int), cmp);\n\n    int lo = 0, hi = n - 1, found = 0;\n    while (lo < hi) {\n        long long sum = (long long)a[lo] + a[hi];\n        if (sum == S) { found = 1; break; }\n        if (sum < S) lo++;           // too small: a[lo] cannot be part of any pair\n        else hi--;                   // too big: a[hi] cannot be part of any pair\n    }\n    if (found) printf(\"YES %d %d\\n\", a[lo], a[hi]);\n    else printf(\"NO\\n\");\n    return 0;\n}", "runs": [{"in": "6 40\n3 9 14 22 18 7", "out": "YES 18 22"}, {"in": "6 100\n3 9 14 22 18 7", "out": "NO"}, {"in": "5 10\n5 1 9 3 7", "out": "YES 1 9"}]}, {"t": "html", "html": "<div class=\"box note\"><b>Things to notice.</b> The pointers move toward each other and never go back, so the scan is n steps, not n&sup2;. The loop condition <code>lo &lt; hi</code> makes sure the two pointers never use the same element twice. The sum is computed in <code>long long</code> because two numbers near 2 &middot; 10<sup>9</sup> overflow an <code>int</code>. This idea, sort and then move two pointers, is what you need for the last exercise.</div>"}]}], "exercises": [{"title": "Sort and summarise", "level": "Easy", "cls": "easy", "use": "Sections 1, 2", "statement": "Given n integers, print them in increasing order, and then print the smallest value, the median and the largest value. For this problem the <b>median</b> is the element at position (n - 1) / 2 of the sorted array (positions start at 0, integer division), so for an even n it is the lower of the two middle elements.", "input": ["Line 1: an integer n (1 &le; n &le; 10<sup>5</sup>).", "Line 2: n integers, each between -10<sup>9</sup> and 10<sup>9</sup>."], "output": ["Line 1: the n numbers in increasing order, separated by single spaces.", "Line 2: three integers separated by spaces: the smallest value, the median, the largest value."], "extra": "n = 10<sup>5</sup> is too large for selection sort within a second. Use <code>qsort</code>.", "examples": [{"in": "5\n3 1 4 1 5", "out": "1 1 3 4 5\n1 3 5"}, {"in": "4\n10 -2 7 0", "out": "-2 0 7 10\n-2 0 10"}, {"in": "1\n42", "out": "42\n42 42 42"}, {"in": "2\n1000000000 -1000000000", "out": "-1000000000 1000000000\n-1000000000 -1000000000 1000000000"}]}, {"title": "Frequency table of huge values", "level": "Easy - Medium", "cls": "easymed", "use": "Sections 2, 4", "statement": "Given n integers, print how many different values there are, and then, for each different value in <b>increasing order</b>, the value and how many times it appears.<br><br>The values are as large as 10<sup>9</sup> in absolute value, so a frequency array indexed by the value (Day 3) is not possible here.", "input": ["Line 1: an integer n (1 &le; n &le; 10<sup>5</sup>).", "Line 2: n integers, each between -10<sup>9</sup> and 10<sup>9</sup>."], "output": ["Line 1: the number of different values, D.", "Then D lines, each with two integers: a value and the number of times it appears, in increasing order of the value."], "extra": "", "examples": [{"in": "6\n5 -1 5 3 -1 5", "out": "3\n-1 2\n3 1\n5 3"}, {"in": "1\n7", "out": "1\n7 1"}, {"in": "4\n1000000000 -1000000000 1000000000 0", "out": "3\n-1000000000 1\n0 1\n1000000000 2"}, {"in": "3\n2 2 2", "out": "1\n2 3"}]}, {"title": "How many numbers in [L, R]?", "level": "Medium", "cls": "med", "use": "Sections 2, 3", "statement": "You are given n integers and then q questions. Each question gives two numbers L and R. For each question, print how many of the n integers x satisfy L &le; x &le; R.<br><br><b>Time limit:</b> about 1 second for n = q = 10<sup>5</sup>. Scanning the whole array for each question would need 10<sup>10</sup> steps.", "input": ["Line 1: two integers n and q (1 &le; n, q &le; 10<sup>5</sup>).", "Line 2: n integers, each between -10<sup>9</sup> and 10<sup>9</sup> (the array is <b>not</b> sorted).", "Then q lines, each with two integers L and R (-10<sup>9</sup> &le; L &le; R &le; 10<sup>9</sup>)."], "output": ["q lines: the answer to each question, in the order of the questions."], "extra": "Think about which two lower-bound values give the count, and what the array needs to be before you can use them.", "examples": [{"in": "8 3\n5 1 3 3 9 7 3 10\n3 3\n4 9\n11 20", "out": "3\n3\n0"}, {"in": "5 2\n-5 0 5 -5 0\n-5 -5\n-10 10", "out": "2\n5"}, {"in": "1 2\n100\n100 100\n101 200", "out": "1\n0"}]}, {"title": "Triples with a given sum", "level": "Hard", "cls": "hard", "use": "Sections 2, 4, Example 2", "statement": "Given n integers and a number S, count the triples of <b>positions</b> i &lt; j &lt; k such that a[i] + a[j] + a[k] = S. Equal values at different positions count as different triples.<br><br><b>Time limit:</b> about 1 second for n = 2000. Checking every triple takes about n&sup3;/6 &asymp; 1.3 &middot; 10<sup>9</sup> steps, which is too slow. Aim for about n&sup2;.", "input": ["Line 1: two integers n and S (1 &le; n &le; 2000, -3 &middot; 10<sup>9</sup> &le; S &le; 3 &middot; 10<sup>9</sup>).", "Line 2: n integers, each between -10<sup>9</sup> and 10<sup>9</sup>."], "output": ["One integer: the number of triples with sum S."], "extra": "Careful with two things. Sums of three numbers do not fit in an <code>int</code>. And when the array has many equal values (for example 2000 ones and S = 3) the count is about 1.3 &middot; 10<sup>9</sup>, so a pair of pointers that finds a match must count <i>all</i> the matching combinations, not just one.", "examples": [{"in": "5 6\n1 2 3 4 5", "out": "1"}, {"in": "6 0\n-1 0 1 2 -1 -4", "out": "3"}, {"in": "5 3\n1 1 1 1 1", "out": "10"}, {"in": "4 100\n1 2 3 4", "out": "0"}, {"in": "3 3000000000\n1000000000 1000000000 1000000000", "out": "1"}]}]});
